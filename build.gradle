plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'scala'
    id 'com.google.protobuf' version '0.9.4'
}

ext {
    publishLibraryRepo  = "https://maven.pkg.github.com/solop-develop/adempiere-base"
    publishGroupId = "org.solop.adempiere"
    publishUsername = findProperty("deployUsername") ?: System.properties['deploy.user']
    publishPassword = findProperty("deployPassword") ?: System.properties['deploy.token']
    publishVersion = findProperty("deployVersion") ?: "local-1.0.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_17
}

def protobufVersion = '3.25.4'
def grpcVersion = '1.65.1'

repositories {
    mavenLocal()
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs 'base/src/main/java'
            srcDirs 'src/main/proto'
            srcDirs 'build/generated/source/protobuf/main/java'
            srcDirs 'authentication/src/main/java'
            srcDirs 'cashflow/src/main/java'
            srcDirs 'crm/src/main/java'
            srcDirs 'dashboard/src/main/java'
            srcDirs 'discord/src/main/java'
            srcDirs 'distribution/src/main/java'
            srcDirs 'finance_management/src/main/java'
            srcDirs 'fixed_asset/src/main/java'
            srcDirs 'freight/src/main/java'
            srcDirs 'grpc_utils/src/main/java'
            srcDirs 'hr_and_payroll/src/main/java'
            srcDirs 'hr_time_and_attendance/src/main/java'
            srcDirs 'jasper_reports/src/main/java'
            srcDirs 'jwt/src/main/java'
            srcDirs 'kafka/src/main/java'
            srcDirs 'manufacturing/src/main/java'
            srcDirs 'pos/src/main/java'
            srcDirs 'processors/src/main/java'
            srcDirs 'production/src/main/java'
            srcDirs 'project/src/main/java'
            srcDirs 'request/src/main/java'
            srcDirs 'service/src/main/java'
            srcDirs 'store/src/main/java'
            srcDirs 'telegram/src/main/java'
            srcDirs 'warehouse/src/main/java'
            srcDirs 'withholding_engine/src/main/java'
        }
        scala {
            srcDirs 'service/src/main/scala'
        }
    }
}

