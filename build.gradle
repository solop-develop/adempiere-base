def entityType = 'D'

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc{}
        }
    }
}

jar {
	manifest {
		attributes(
			"Implementation-Title": "Adempiere",
			"Implementation-Version": publishVersion,
			"EntityType": entityType)
	}
}


publishing {
    repositories {
        mavenLocal()
        maven {
            url = publishLibraryRepo
            credentials {
                username = publishUsername
                password = publishPassword
            }
        }
    }
    publications {
        maven(MavenPublication) {
            groupId publishGroupId
            artifactId 'adempiere-core'
            version publishVersion
            from components.java
            pom {
                name = 'ADempiere Core'
                description = 'ADempiere core library as invoice, order and other core library.'
                url = 'http://adempiere.io/'
                licenses {
                    license {
                        name = 'GNU General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'yamelsenih'
                        name = 'Yamel Senih'
                        email = 'yamel.senih@solopsoftware.com'
                    }
                }
            }
        }
    }
}